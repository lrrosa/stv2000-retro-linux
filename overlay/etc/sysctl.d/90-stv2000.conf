# swap comprimido em RAM (zram) é barato: use antes de faltar memória (1 GB)
vm.swappiness = 100
# console da TV sem mensagens do kernel por cima do RetroArch
kernel.printk = 3 4 1 3
# gravação no cartão: o que muda fica no máximo ~3 s só na memória (padrão: 30 s), e o
# kernel junta muitos arquivos pequenos numa gravação só. Assim copiar jogos pela rede é
# rápido e tirar o aparelho da tomada alguns segundos depois não perde o que foi copiado.
vm.dirty_expire_centisecs = 300
vm.dirty_writeback_centisecs = 100
