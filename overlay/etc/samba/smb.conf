# Compartilhamento da partição JOGOS na rede local: \\STV2000\JOGOS (ou \\<IP>\JOGOS).
# Leitura e escrita, aceito só da rede local, de dois jeitos:
#   - anônimo (convidado): celular, TV, VLC, Mac/Linux escolhendo "Convidado/Anônimo";
#   - usuário gamer / senha retro: o Windows. O Windows 11 exige assinatura SMB, que
#     uma sessão de convidado não tem; por isso aqui ele pede usuário e senha.
# Detalhes em docs/CONFIGURACAO.md. Para trocar essa senha: doas smbpasswd gamer
# Depois de editar este arquivo: doas rc-service samba restart

[global]
   workgroup = WORKGROUP
   netbios name = STV2000
   server string = STV-2000 Retro Linux
   server role = standalone server
   passdb backend = tdbsam

   # Login anônimo entra como convidado. Usuário desconhecido ou senha errada é
   # RECUSADO (não vira convidado): assim o Windows, que tenta antes com a conta do
   # PC, recebe "senha incorreta" e abre a janela pedindo usuário e senha. Com
   # "Bad User" ele virava convidado, o Windows 11 recusava a sessão sem assinatura e
   # o Explorador só mostrava a pasta vazia.
   map to guest = Never
   restrict anonymous = 0

   # só a rede local (IPv4 privado/link-local, IPv6 link-local/ULA). Se a sua rede
   # usar outra faixa, acrescente-a aqui.
   hosts allow = 127. 10. 172.16.0.0/12 192.168. 169.254. ::1 fe80::/10 fc00::/7

   # leve: sem impressoras e com pouco log (cartão SD)
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/%m.log
   max log size = 64
   log level = 0

   # partição FAT32: sem atributos estendidos nem ACLs
   store dos attributes = no
   ea support = no
   nt acl support = no
   map archive = no
   map hidden = no
   map system = no
   map readonly = no

   # macOS: não deixa os arquivos ._nome e .DS_Store na partição
   veto files = /._*/.DS_Store/
   delete veto files = yes

[JOGOS]
   comment = Jogos, BIOS e saves do STV-2000
   path = /media/jogos
   browseable = yes
   read only = no
   guest ok = yes
   force user = gamer
   force group = gamer
   create mask = 0644
   directory mask = 0755
   # NÃO use "case sensitive = yes" para acelerar pastas grandes: com iocharset=utf8 a
   # FAT32 no Linux diferencia maiúsculas/minúsculas, e o Windows passaria a criar
   # "Jogo.a26" e "JOGO.A26" lado a lado (nomes duplicados na FAT) e a não achar
   # arquivos/pastas escritos com outra caixa. A busca sem caixa do Samba é que protege.
