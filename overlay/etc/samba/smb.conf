# Compartilhamento da partição JOGOS na rede local: \\STV2000\JOGOS (ou \\<IP>\JOGOS).
# Acesso anônimo (convidado), com leitura e escrita, aceito só da rede local.
#
# Windows 11 24H2 ou mais novo bloqueia acesso anônimo por padrão. Nesse caso, guarde
# uma vez o usuário do aparelho no PC (PowerShell):  cmdkey /add:STV2000 /user:gamer /pass:retro
# Detalhes em docs/CONFIGURACAO.md. Para trocar essa senha: doas smbpasswd gamer
# Depois de editar este arquivo: doas rc-service samba restart

[global]
   workgroup = WORKGROUP
   netbios name = STV2000
   server string = STV-2000 Retro Linux
   server role = standalone server
   passdb backend = tdbsam

   # anônimo: quem não tem usuário no aparelho entra como convidado
   map to guest = Bad User
   restrict anonymous = 0

   # só a rede local (IPv4 privado/link-local, IPv6 link-local/ULA). Se a sua rede
   # usar outra faixa, acrescente-a aqui.
   hosts allow = 127. 10. 172.16.0.0/12 192.168. 169.254. ::1 fe80::/10 fc00::/7

   # leve: sem impressoras e com pouco log (cartão SD)
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/%m.log
   max log size = 64
   log level = 0

   # partição FAT32: sem atributos estendidos nem ACLs
   store dos attributes = no
   ea support = no
   nt acl support = no
   map archive = no
   map hidden = no
   map system = no
   map readonly = no

   # macOS: não deixa os arquivos ._nome e .DS_Store na partição
   veto files = /._*/.DS_Store/
   delete veto files = yes

[JOGOS]
   comment = Jogos, BIOS e saves do STV-2000
   path = /media/jogos
   browseable = yes
   read only = no
   guest ok = yes
   force user = gamer
   force group = gamer
   create mask = 0644
   directory mask = 0755
