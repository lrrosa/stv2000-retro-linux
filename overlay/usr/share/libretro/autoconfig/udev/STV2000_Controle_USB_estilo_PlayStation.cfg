# Controle USB genérico estilo PlayStation: chip DragonRise 0079:0011, nome "USB Gamepad ".
# Vários perfis do RetroArch usam esse mesmo ID (Retrolink Saturn, Hyperkin Genesis...), e
# ele escolhia o do Saturn: o Select virava Start e o Start não funcionava.
# input_phys = "usb-" combina com qualquer porta USB e dá a este perfil a nota máxima do
# RetroArch (60), então ele vence os outros. Botões numerados como no controle:
#   0 = triângulo (1)  1 = bola (2)  2 = xis (3)  3 = quadrado (4)
#   4 = L2  5 = R2  6 = L1  7 = R1  8 = Select  9 = Start  10 = L3  11 = R3
# No RetroPad: xis = B (confirma no menu), bola = A, quadrado = Y, triângulo = X.
input_driver = "udev"
input_device = "USB Gamepad "
input_device_display_name = "Controle USB (estilo PlayStation)"
input_vendor_id = "121"
input_product_id = "17"
input_phys = "usb-"

input_b_btn = "2"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "0"
input_l2_btn = "4"
input_r2_btn = "5"
input_l_btn = "6"
input_r_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_l3_btn = "10"
input_r3_btn = "11"

# direcional: eixos no modo digital, "hat" no modo analógico
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_b_btn_label = "Xis"
input_a_btn_label = "Bola"
input_y_btn_label = "Quadrado"
input_x_btn_label = "Triângulo"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
