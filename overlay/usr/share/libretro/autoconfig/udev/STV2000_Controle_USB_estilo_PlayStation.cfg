# Controle USB genérico com botões numerados (1-4), marca "MASTER", no formato de um
# controle de PlayStation (direcional, 4 botões em losango, Select/Start, 4 ombros; sem
# analógicos). Chip DragonRise 0079:0011, nome "USB Gamepad ". Vários perfis do RetroArch
# usam esse mesmo ID (Retrolink Saturn, Hyperkin Genesis...) e ele escolhia o do Saturn:
# o Select virava Start. O input_phys = "usb-" combina com qualquer porta USB e dá a este
# perfil a nota máxima do RetroArch (60), então ele vence os outros.
#
# Mapeamento confirmado por captura do /dev/input/js0 neste controle:
#   face: "1"(direita)=idx0  "2"(baixo)=idx1  "3"(esquerda)=idx2  "4"(cima)=idx3
#   ombros: L1=4  R1=5  L2=6  R2=7     Select=8  Start=9
#   direcional: eixos analógicos 0 (horizontal) e 1 (vertical) — não tem "hat"
# No RetroPad (losango padrão, o botão de baixo confirma no menu):
#   B(baixo)="2"(idx1)  A(direita)="1"(idx0)  Y(esquerda)="3"(idx2)  X(cima)="4"(idx3)
input_driver = "udev"
input_device = "USB Gamepad "
input_device_display_name = "Controle USB numerado (estilo PlayStation)"
input_vendor_id = "121"
input_product_id = "17"
input_phys = "usb-"

input_b_btn = "1"
input_a_btn = "0"
input_y_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"

# direcional nos eixos analógicos (este controle não tem "hat" nem analógicos)
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"

input_b_btn_label = "2"
input_a_btn_label = "1"
input_y_btn_label = "3"
input_x_btn_label = "4"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
