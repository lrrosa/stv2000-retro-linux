# RetroArch - configuração inicial do STV-2000 (S905W, GPU Mali-450 via lima, 1 GB RAM)
# O RetroArch completa o resto com os padrões e salva aqui ao sair.

# Vídeo: KMS direto (sem X11/Wayland), OpenGL ES 2, 720p (mais leve para a Mali-450)
video_driver = "gl"
video_context_driver = "kms"
video_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "720"
video_refresh_rate = "60.000000"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
video_shader_enable = "false"
video_font_enable = "true"
fps_show = "false"

# Interface no estilo Lakka: menu XMB (como o do PS3), em português do Brasil.
# Uma aba por sistema (ícone + fundo próprios), lista de jogos com capa, Favoritos
# e Histórico. Sem o fundo animado (economiza a GPU Mali-450).
# Ícones coloridos (tema "retrosystem": controles de cada console) e fundos com tema de
# jogos: tela do jogo desfocada em cada sistema; nas outras abas, um degradê com
# silhuetas de controles (gerado por scripts/gen-fundos.py). "menu_wallpaper" vale nos
# submenus (o XMB procura o fundo pelo título da tela e cai nele quando não acha).
menu_driver = "xmb"
user_language = "7"
xmb_theme = "7"
xmb_menu_color_theme = "2"
menu_shader_pipeline = "0"
menu_dynamic_wallpaper_enable = "true"
dynamic_wallpapers_directory = "/usr/share/stv2000/fundos"
menu_wallpaper = "/usr/share/stv2000/fundos/Menu principal.png"
menu_wallpaper_opacity = "0.700000"
menu_show_sublabels = "true"
menu_remember_selection = "1"
# sem "1.22.2 - Sem núcleo" no rodapé (informação técnica, não serve ao jogador)
menu_core_enable = "false"
# relógio no formato brasileiro: "20/11 14:30" (separador 1 = barra)
menu_timedate_date_separator = "1"

# Abas: só o que interessa para jogar
content_show_favorites = "true"
content_show_history = "true"
content_show_playlists = "true"
content_show_settings = "true"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_explore = "false"
content_show_add_entry = "0"
content_show_contentless_cores = "0"

# Menu principal enxuto, com "Reiniciar" e "Desligar" (patch do STV-2000)
menu_show_load_core = "false"
menu_show_load_content = "true"
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_eject_disc = "false"
menu_show_configurations = "false"
menu_show_online_updater = "true"
menu_show_core_updater = "false"
menu_show_legacy_thumbnail_updater = "false"
menu_show_information = "true"
menu_show_help = "true"
menu_show_restart_retroarch = "false"
menu_show_quit_retroarch = "false"
menu_show_reboot = "true"
menu_show_shutdown = "true"
menu_show_advanced_settings = "false"
quit_press_twice = "true"

# Listas de jogos: capa à direita e tela-título; baixadas sozinhas do servidor
# libretro quando há cabo de rede (ficam em JOGOS\thumbnails para usar offline)
menu_thumbnails = "3"
menu_left_thumbnails = "2"
network_on_demand_thumbnails = "true"
playlist_sort_alphabetical = "true"
playlist_show_sublabels = "true"
content_runtime_log = "true"
playlist_sublabel_runtime_type = "0"
history_list_enable = "true"
content_history_size = "50"

# Controles: udev, com perfis automáticos.
#   Select+Start  = sai do jogo e volta à lista (combinação "sair", que o patch 0002
#                   faz fechar só o jogo; sem jogo aberto não faz nada)
#   segurar Start = menu do jogo (salvar/carregar estado, trocar disco...) - 2 s
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_menu_toggle_gamepad_combo = "7"
input_quit_gamepad_combo = "4"

# Áudio pela HDMI (ALSA direto)
audio_driver = "alsa"
audio_device = ""
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
# Sem MIDI: o aparelho não tem sequenciador ALSA (/dev/snd/seq) e o driver "alsa"
# só deixava "ALSA lib seq_hw.c ... failed" no log e na tela de erro
midi_driver = "null"

# Cores e dados (pacotes do Alpine + cores compilados para este aparelho)
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
content_database_path = "/usr/share/libretro/database/rdb"
cheat_database_path = "/usr/share/libretro/database/cht"
core_updater_buildbot_cores_url = ""

# Tudo do jogador fica na partição JOGOS (acessível pelo Windows)
rgui_browser_directory = "/media/jogos/roms"
system_directory = "/media/jogos/bios"
savefile_directory = "/media/jogos/saves"
savestate_directory = "/media/jogos/states"
screenshot_directory = "/media/jogos/screenshots"
thumbnails_directory = "/media/jogos/thumbnails"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"
playlist_directory = "/home/gamer/.config/retroarch/playlists"

config_save_on_exit = "true"
pause_nonactive = "false"
